<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{margin:0;height:100vh;width:100vw;overflow:hidden;font-family:sans-serif;background-color:#000;display:flex;align-items:center;justify-content:center;}#game-container{position:relative;width:1000px;height:600px;background-color:#111;background-image:url("https://i.imgur.com/EWmnBnH.jpeg");background-size:cover;background-position:center;overflow:hidden;transform-origin:center center;box-shadow:0 0 30px rgba(0,243,255,0.1);}.base{position:absolute;border-radius:8px;padding:10px;display:flex;align-items:center;justify-content:center;}#main-field{position:absolute;top:377px;left:264px;width:300px;height:200px;border-radius:8px;border:none;box-shadow:none;background-size:cover;background-position:center;transition:transform 0.1s ease-in,filter 0.1s ease-in,opacity 0.1s ease-in;display:flex !important;}.task-card{position:absolute;z-index:40;border:1px solid #00f3ff;background:rgba(0,20,30,0.8);background-size:100% 100%;background-position:center;width:350px;min-height:261px;border-radius:8px;font-family:'Comic Sans MS', cursive;color:#d5f245;display:flex;flex-direction:column;box-sizing:border-box;box-shadow:0 0 20px rgba(0,243,255,0.3);padding:15px 15px 15px 15px;justify-content:center;align-items:center;text-align:center;}.task-question{font-weight:bold;font-family:'Comic Sans MS', cursive;color:#d5f245;font-size:37px;margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid rgba(0,243,255,0.5);text-shadow:1px 1px 3px rgba(0,0,0,0.8);width:100%;}.task-answer-btn{width:100%;padding:12px;margin-bottom:8px;background:rgba(0,243,255,0.2);border:1px solid #00f3ff;border-radius:5px;color:#11d452;font-family:'Comic Sans MS', cursive;font-size:20px;cursor:pointer;transition:all 0.2s;text-shadow:1px 1px 3px rgba(0,0,0,0.8);box-sizing:border-box;}.task-answer-btn:hover:not(:disabled){background:rgba(0,243,255,0.4);transform:scale(1.02);box-shadow:0 0 15px #00f3ff;}.task-answer-btn:disabled{cursor:default;}.task-answer-btn.wrong{background:rgba(255,0,0,0.5);border-color:#ff0000;}.task-answer-btn.correct{background:rgba(0,255,0,0.5);border-color:#00ff00;}.ui-box{position:absolute;z-index:50;background:#0b320fb3;border:1px solid #00f3ff;backdrop-filter:blur(10px);padding:8px 12px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;font-family:'Comic Sans MS', cursive;font-size:20px;}@keyframes dropRain{from{top:-30px;opacity:1;}to{top:100vh;opacity:0;}}@keyframes popIn{0%{transform:translate(-50%,-50%) scale(0.5);opacity:0;}80%{transform:translate(-50%,-50%) scale(1.1);opacity:1;}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}@keyframes rainbow{0%{border-color:red;box-shadow:0 0 20px red;}33%{border-color:lime;box-shadow:0 0 20px lime;}66%{border-color:blue;box-shadow:0 0 20px blue;}100%{border-color:red;box-shadow:0 0 20px red;}}.rainbow-fx{animation:rainbow 3s linear infinite;border-style:solid !important;}.screen-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background-size:cover;background-position:center;}.screen-bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:-1;}.action-btn{margin-top:20px;padding:10px 20px;cursor:pointer;background:#00f3ff;color:#000;border:none;border-radius:5px;font-weight:bold;font-size:16px;transition:0.3s;box-shadow:0 0 10px rgba(0,243,255,0.5);}.action-btn:hover{background:#fff;transform:scale(1.05);}#start-screen{font-family:'Comic Sans MS', cursive;color:#5be67e;}#start-screen .screen-bg{background:rgba(0,0,0,0.85);}#feedback{font-family:'Comic Sans MS', cursive;color:#14ee11;display:none;background:rgba(0,0,0,0.9);}</style></head><body><div id="game-container"><audio id="bg-m" loop ></audio><audio id="aud-cor" ></audio><audio id="aud-wr" ></audio><div id="main-field" class=""></div><div id="ui-layer"></div><div id="fx-layer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:90;"></div><div class="ui-box" style="top:10px;left:10px;color:#5bef25;"><b>Счет:<span id="val-score">0</span></b></div><div id="ui-timer-block" class="ui-box" style="top:11px;left:853px;color:#5bef25;"><b>Таймер:<span id="val-timer">0</span></b></div><div class="ui-box" style="top:546px;left:853px;"><b>🔊</b><input type="range" style="width:60px;" id="vol-slider"></div><div class="ui-box" style="top:8px;left:421px;width:200px;height:35px;flex-direction:column;padding:5px;"><div style="font-size:14px;color:#fff;margin-bottom:2px;">Прогресс</div><div style="width:100%;height:10px;background:rgba(0,0,0,0.5);border-radius:5px;overflow:hidden;"><div id="val-life" style="height:100%;width:0%;background:#945f05;transition:0.5s;"></div></div></div><div id="start-screen" class="screen-overlay"><div class="screen-bg"></div><h1 style="font-size:40px;margin-bottom:15px;text-shadow:2px 2px 5px #000;z-index:1;">Help the baby frog to make the raft!</h1><div style="font-size:20px;margin-bottom:30px;text-shadow:1px 1px 3px #000;z-index:1;max-width:80%;white-space:pre-wrap;">Answer the questions and make the raft ready!</div><button class="action-btn" onclick="startGame()" style="z-index:1;font-family:'Comic Sans MS', cursive;">GO</button></div><div id="feedback" class="screen-overlay"><h2 style="font-size:40px;margin-bottom:10px;text-shadow:2px 2px 5px #000;">Raft is Ready</h2><div style="font-size:20px;margin-bottom:20px;text-shadow:1px 1px 3px #000;">Thanks for your help</div><div id="fb-res" style="font-size:20px;margin-bottom:20px;line-height:1.5;"></div><img src="https://i.imgur.com/RShNl3J.png" style="width:300px;margin-bottom:20px;filter:drop-shadow(0 0 15px rgba(255,255,255,0.3));"><button class="action-btn" onclick="location.reload()" style="font-family:'Comic Sans MS', cursive;">Играть снова</button></div></div><script>const cfg={"imgs":["https://i.imgur.com/wveu6np.png","https://i.imgur.com/myfGPlt.png","https://i.imgur.com/9eSaje8.png","https://i.imgur.com/GRYP3Qa.png","https://i.imgur.com/YXNJCzj.png","https://i.imgur.com/RShNl3J.png"],"q":["I ___ a student.","She ___ my best friend.","They ___ at school now.","He ___ not happy today.","We ___ not in the park right now.","I ___ not tired at the moment.","I ___ a new bike.","She ___ a cute puppy.","They ___ many toys.","He ___ not got a sister.","We ___ not got a big house.","I ___ not got a pet.","She ___ to school every day.","They ___ football every Saturday.","He ___ not like broccoli.","We ___ not watch TV in the morning.","I ___ my homework every evening.","The cat ___ milk every morning.","She ___ a book right now.","They ___ in the garden at the moment.","He ___ not sleeping now.","We ___ not watching TV right now.","I ___ not eating at the moment.","The children ___ dancing now."],"a":["am","is","are","is","are","am","have got","has got","have got","has","have","have","goes","play","does","do","do","drinks","is reading","are playing","is","are","am","are"],"w":[["is","are"],["am","are"],["is","am"],["am","are"],["is","am"],["is","are"],["has got","is"],["have got","is"],["has got","is"],["have","is"],["has","is"],["has","is"],["go","play"],["plays","goes"],["do","is"],["does","is"],["does","goes"],["drink","play"],["are reading","reads"],["is playing","plays"],["am","are"],["is","am"],["is","are"],["is","am"]],"ptsStep":4,"ptsTask":1,"bg":"https://i.imgur.com/EWmnBnH.jpeg","audio":"","timerVal":60,"isCountdown":false,"startTitle":"Help the baby frog to make the raft!","startDesc":"Answer the questions and make the raft ready!","startBtn":"GO","startFont":"'Comic Sans MS', cursive","startTitleSz":"40","startDescSz":"20","startColor":"#5be67e","startBg":"","slogan":"Raft is Ready","motiv":"Thanks for your help","reward":"https://i.imgur.com/RShNl3J.png","fbImgSize":"300","fbFont":"'Comic Sans MS', cursive","fbTitleSz":"40","fbDescSz":"20","fbColor":"#14ee11","showTime":true,"showCorrect":true,"randomize":true,"loop":false,"contentWidth":"100","taskFields":[],"defaultTaskPos":{"top":"90px","left":"544px"},"fxCorImg":"","fxWrImg":"","fxCorAud":"","fxWrAud":"","strings":{"score":"Счет:","timer":"Таймер:","prog":"Прогресс","again":"Играть снова","total":"Итоговый счет:","time":"Время:","correct":"Верных ответов:"}};let score=0,curQIndex=0,time=cfg.isCountdown?cfg.timerVal:0,tInt=null,timeElapsed=0,correctAnswers=0;const totalQ=cfg.q.length,main=document.getElementById('main-field'),fxLayer=document.getElementById('fx-layer');function autoScaleGame(){const w=window.innerWidth,h=window.innerHeight,scale=Math.min(w/1000,h/600);document.getElementById('game-container').style.transform='scale('+scale+')';}window.addEventListener('resize',autoScaleGame);autoScaleGame();let questionOrder=Array.from({length:cfg.q.length},(_,i)=>i);if(cfg.randomize)questionOrder.sort(()=>Math.random()-0.5);const targetPositions=cfg.taskFields&&cfg.taskFields.length>0?cfg.taskFields:[cfg.defaultTaskPos];function updateMain(){const maxScore=cfg.ptsStep*(cfg.imgs.length-1),progress=maxScore>0?Math.min(100,(score/maxScore)*100):(score>0?100:0),idx=Math.min(Math.floor(score/cfg.ptsStep),Math.max(0,cfg.imgs.length-1)),currentIdx=main.getAttribute('data-img-idx');if(cfg.imgs[idx]&&currentIdx!==String(idx)){main.style.transform='scale(1.03)';main.style.filter='blur(2px)';setTimeout(()=>{main.style.backgroundImage='url("'+cfg.imgs[idx]+'")';main.style.transform='scale(1)';main.style.filter='blur(0)';main.setAttribute('data-img-idx',idx);},100);}else if(!main.getAttribute('data-img-idx')&&cfg.imgs[idx]){main.style.backgroundImage='url("'+cfg.imgs[idx]+'")';main.setAttribute('data-img-idx',idx);}document.getElementById('val-score').innerText=score;document.getElementById('val-life').style.width=progress+'%';}function spawn(){const layer=document.getElementById('ui-layer');layer.innerHTML='';if(curQIndex>=questionOrder.length){if(cfg.loop){curQIndex=0;if(cfg.randomize)questionOrder.sort(()=>Math.random()-0.5);}else{return end();}}let curQ=questionOrder[curQIndex];const taskCard=document.createElement('div');taskCard.className='task-card';const pos=targetPositions[curQIndex%targetPositions.length]||cfg.defaultTaskPos;taskCard.style.top=pos.top||cfg.defaultTaskPos.top;taskCard.style.left=pos.left||cfg.defaultTaskPos.left;const qText=cfg.q[curQ]||"Вопрос не задан",aText=cfg.a[curQ]||"Ответ",questionDiv=document.createElement('div');questionDiv.className='task-question';questionDiv.innerHTML=qText;taskCard.appendChild(questionDiv);const allAnswers=[{text:aText,correct:true},...(cfg.w[curQ]||[]).map(text=>({text:text,correct:false}))];allAnswers.sort(()=>Math.random()-0.5);allAnswers.forEach((ansObj)=>{const answerBtn=document.createElement('button');answerBtn.className='task-answer-btn';answerBtn.innerHTML=ansObj.text;answerBtn.onclick=(e)=>{document.querySelectorAll('.task-answer-btn').forEach(b=>b.disabled=true);if(ansObj.correct){answerBtn.classList.add('correct');correctAnswers++;const aud=document.getElementById('aud-cor');if(cfg.fxCorAud&&aud){aud.currentTime=0;aud.play().catch(()=>{});}if(cfg.fxCorImg){fxLayer.innerHTML='<img src="'+cfg.fxCorImg+'" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:80%;max-height:80%;animation:popIn 0.3s forwards;">';}else{let html='';const colors=['#ff0','#f0f','#0ff','#0f0','#f00','#fff'],rect=answerBtn.getBoundingClientRect(),scale=parseFloat(document.getElementById('game-container').style.transform.replace('scale(','').replace(')',''))||1,containerRect=document.getElementById('game-container').getBoundingClientRect(),cx=((e.clientX||(rect.left+rect.width/2))-containerRect.left)/scale,cy=((e.clientY||(rect.top+rect.height/2))-containerRect.top)/scale;for(let i=0;i<30;i++){let col=colors[Math.floor(Math.random()*colors.length)],ang=Math.random()*Math.PI*2,spd=Math.random()*120+50;html+='<div style="position:absolute;background:'+col+';width:8px;height:8px;border-radius:50%;top:'+cy+'px;left:'+cx+'px;transition:transform 0.8s cubic-bezier(0.1,0.8,0.3,1),opacity 0.8s;opacity:1;" data-dx="'+(Math.cos(ang)*spd)+'" data-dy="'+(Math.sin(ang)*spd)+'" class="fx-spark"></div>';}fxLayer.innerHTML=html;setTimeout(()=>{document.querySelectorAll('.fx-spark').forEach(el=>{el.style.transform='translate('+el.getAttribute('data-dx')+'px,'+el.getAttribute('data-dy')+'px)';el.style.opacity='0';});},50);}setTimeout(()=>{fxLayer.innerHTML='';score+=cfg.ptsTask;curQIndex++;updateMain();spawn();},1200);}else{answerBtn.classList.add('wrong');const aud=document.getElementById('aud-wr');if(cfg.fxWrAud&&aud){aud.currentTime=0;aud.play().catch(()=>{});}if(cfg.fxWrImg){fxLayer.innerHTML='<img src="'+cfg.fxWrImg+'" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:80%;max-height:80%;animation:popIn 0.3s forwards;">';setTimeout(()=>{fxLayer.innerHTML='';},1200);}else{let html='';for(let i=0;i<30;i++){let left=Math.random()*100,dur=(0.5+Math.random()*0.4)*1.2,del=Math.random()*0.2;html+='<div style="position:absolute;background:#00f3ff;width:3.3px;height:22px;top:-30px;left:'+left+'%;border-radius:2px;animation:dropRain '+dur+'s '+del+'s linear forwards;"></div>';}fxLayer.innerHTML=html;setTimeout(()=>{fxLayer.innerHTML='';},1440);}}};taskCard.appendChild(answerBtn);});layer.appendChild(taskCard);}function startGame(){document.getElementById('start-screen').style.display='none';const bgm=document.getElementById('bg-m');if(cfg.audio&&bgm)bgm.play().catch(()=>{});tInt=setInterval(()=>{timeElapsed++;if(cfg.isCountdown){time--;document.getElementById('val-timer').innerText=time;if(time<=0)end();}else{time++;document.getElementById('val-timer').innerText=time;}},1000);updateMain();spawn();}function end(){if(tInt)clearInterval(tInt);document.getElementById('feedback').style.display='flex';let resHtml='<b>'+cfg.strings.total+' '+score+'</b>';if(cfg.showTime)resHtml+='<br>'+cfg.strings.time+' '+timeElapsed+' с';if(cfg.showCorrect)resHtml+='<br>'+cfg.strings.correct+' '+correctAnswers+' / '+totalQ;document.getElementById('fb-res').innerHTML=resHtml;}document.getElementById('vol-slider').addEventListener('input',(e)=>{const bgm=document.getElementById('bg-m');if(bgm)bgm.volume=e.target.value/100;});</script></body></html>
